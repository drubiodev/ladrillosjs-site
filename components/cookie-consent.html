<style>
    .consent-shell {
        position: fixed;
        right: 1.25rem;
        bottom: 1.25rem;
        left: 1.25rem;
        z-index: 1200;
        display: flex;
        justify-content: center;
        pointer-events: none;
    }

    .consent-panel {
        width: min(100%, 720px);
        padding: 1.25rem;
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-top: 4px solid var(--primary);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(35, 35, 35, 0.2);
        pointer-events: auto;
    }

    .consent-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1.25rem;
        align-items: center;
    }

    .consent-copy h2 {
        margin: 0 0 0.35rem;
        font-size: 1.05rem;
        line-height: 1.3;
    }

    .consent-copy p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.875rem;
        line-height: 1.55;
    }

    .consent-copy a {
        font-weight: 600;
    }

    .consent-actions {
        display: flex;
        gap: 0.625rem;
    }

    .consent-button {
        min-height: 42px;
        padding: 0.65rem 1rem;
        border: 1px solid var(--text-primary);
        border-radius: 6px;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
    }

    .consent-button-secondary {
        background: #ffffff;
        color: var(--text-primary);
    }

    .consent-button-primary {
        background: var(--text-primary);
        color: #ffffff;
    }

    .consent-button:hover {
        border-color: var(--primary);
    }

    .consent-button:focus-visible {
        outline: 3px solid rgba(255, 107, 53, 0.35);
        outline-offset: 2px;
    }

    @media (max-width: 640px) {
        .consent-shell {
            right: 0.75rem;
            bottom: 0.75rem;
            left: 0.75rem;
        }

        .consent-content {
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .consent-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
    }
</style>

<show condition="visible">
    <div class="consent-shell">
        <section class="consent-panel" role="dialog" aria-label="Analytics cookie preferences" aria-live="polite">
            <div class="consent-content">
                <div class="consent-copy">
                    <h2>Analytics cookies</h2>
                    <p>
                        May we use Microsoft Clarity to understand how this site is used?
                        Clarity does not load unless you accept. Advertising storage stays disabled.
                        <a href="./privacy.html">Privacy details</a>
                    </p>
                </div>
                <div class="consent-actions">
                    <button class="consent-button consent-button-secondary" type="button"
                        onclick="setConsent('denied')">
                        Decline
                    </button>
                    <button class="consent-button consent-button-primary" type="button" onclick="setConsent('granted')">
                        Accept analytics
                    </button>
                </div>
            </div>
        </section>
    </div>
</show>

<script>
    const consentKey = "ladrillosjs-clarity-consent";
    let visible = true;

    try {
        visible = localStorage.getItem(consentKey) === null;
    } catch {
        visible = true;
    }

    function setConsent(value) {
        $emit("clarity-consent-change", value);
        visible = false;
    }

    $listen("open-consent-preferences", () => {
        visible = true;
    });
</script>
