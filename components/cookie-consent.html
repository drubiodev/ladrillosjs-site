<style>
    /* Quick repeat taps shouldn't zoom on mobile; iOS needs this per shadow root (see styles/site.css). */
    * {
        touch-action: manipulation;
    }

    .consent-shell {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 1200;
        pointer-events: none;
    }

    .consent-panel {
        box-sizing: border-box;
        width: min(calc(100vw - 2rem), 580px);
        padding: 1rem 1.1rem;
        background: rgba(244, 240, 235, 0.88);
        border: 0;
        border-top: 1px solid rgba(255, 105, 71, 0.5);
        border-radius: 0;
        box-shadow: 0 14px 38px rgba(44, 30, 24, 0.12);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        pointer-events: auto;
        animation: consentEnter 0.5s var(--ease-out) both;
    }

    .consent-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1rem;
        align-items: center;
    }

    .consent-copy h2 {
        margin: 0 0 0.3rem;
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .consent-copy p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.78rem;
        line-height: 1.5;
    }

    .consent-copy a {
        color: var(--text-primary);
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: rgba(31, 28, 27, 0.25);
        text-underline-offset: 2px;
    }

    .consent-actions {
        display: flex;
        gap: 0.45rem;
    }

    .consent-button {
        box-sizing: border-box;
        min-height: 36px;
        padding: 0.5rem 0.75rem;
        border: 0;
        border-radius: 0;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition:
            color 0.2s ease,
            background 0.2s ease,
            transform 0.3s var(--ease-out);
    }

    .consent-button-secondary {
        background: transparent;
        color: var(--text-secondary);
    }

    .consent-button-primary {
        background: var(--text-primary);
        color: #ffffff;
    }

    .consent-button:hover {
        transform: translateY(-1px);
    }

    .consent-button-secondary:hover {
        color: var(--text-primary);
        background: rgba(31, 28, 27, 0.06);
    }

    .consent-button-primary:hover {
        background: #302b29;
    }

    .consent-button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    @keyframes consentEnter {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 640px) {
        .consent-shell {
            right: 0.75rem;
            bottom: 0.75rem;
            left: 0.75rem;
        }

        .consent-panel {
            width: 100%;
            padding: 1.1rem;
            background: rgba(248, 245, 241, 0.97);
            backdrop-filter: blur(12px) saturate(125%);
            -webkit-backdrop-filter: blur(12px) saturate(125%);
        }

        .consent-content {
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .consent-copy h2 {
            font-size: 0.75rem;
        }

        .consent-copy p {
            color: #514b48;
            font-size: 0.875rem;
            line-height: 1.55;
        }

        .consent-actions {
            justify-content: flex-end;
        }

        .consent-button {
            min-height: 40px;
            padding: 0.6rem 0.85rem;
            font-size: 0.8125rem;
        }
    }
</style>

<show condition="visible">
    <div class="consent-shell">
        <section class="consent-panel" role="dialog" aria-label="Analytics cookie preferences" aria-live="polite">
            <div class="consent-content">
                <div class="consent-copy">
                    <h2>Analytics cookies</h2>
                    <p>
                        May we use Microsoft Clarity to understand how this site is used?
                        Clarity does not load unless you accept. Advertising storage stays disabled.
                        <a href="./privacy.html">Privacy details</a>
                    </p>
                </div>
                <div class="consent-actions">
                    <button class="consent-button consent-button-secondary" type="button"
                        onclick="setConsent('denied')">
                        Decline
                    </button>
                    <button class="consent-button consent-button-primary" type="button" onclick="setConsent('granted')">
                        Accept analytics
                    </button>
                </div>
            </div>
        </section>
    </div>
</show>

<script>
    const consentKey = "ladrillosjs-clarity-consent";
    let visible = true;

    try {
        visible = localStorage.getItem(consentKey) === null;
    } catch {
        visible = true;
    }

    function setConsent(value) {
        $emit("clarity-consent-change", value);
        visible = false;
    }

    $listen("open-consent-preferences", () => {
        visible = true;
    });
</script>
