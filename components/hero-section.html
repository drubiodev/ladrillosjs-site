<style>
  .hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    background: #f5f5f5;
  }

  .hero-card {
    box-shadow: 1px 1px #eee;
    background: white;
    border-radius: 0;
    width: 100%;
    margin: 0 auto;
    min-height: calc(100vh - 8rem);
    min-height: calc(100dvh - 8rem);
    display: flex;
    align-items: center;
    padding: 4rem 2rem;
    position: relative;
    overflow: hidden;
  }

  .hero-inner {
    width: 100%;
    max-width: var(--container-max);
    margin: 0 auto;
    position: relative;
  }

  .hero-container {
    max-width: 600px;
    position: relative;
    z-index: 1;
  }

  /* Brick Animation - SVG Isometric */
  .brick-animation {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 460px;
    height: 460px;
    pointer-events: none;
  }

  .brick-animation svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Cube groups animate in - smooth drop & land */
  .brick-animation .cube-group {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: cubeDropIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* Lay bricks: bottom-left → bottom-right → top */
  .brick-animation .cube-group:nth-of-type(1) {
    animation-delay: 0.1s;
  }

  .brick-animation .cube-group:nth-of-type(2) {
    animation-delay: 0.35s;
  }

  .brick-animation .cube-group:nth-of-type(3) {
    animation-delay: 0.65s;
  }

  /* Shadow fades in */
  .brick-animation .shadow-el {
    opacity: 0;
    animation: shadowReveal 0.9s ease-out 0.25s forwards;
  }

  @keyframes shadowReveal {
    to {
      opacity: 1;
    }
  }

  @keyframes cubeDropIn {
    0% {
      opacity: 0;
      transform: translateY(-40px);
    }

    60% {
      opacity: 1;
    }

    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Responsive */
  @media (max-width: 1100px) {
    .brick-animation {
      right: 0;
      transform: translateY(-50%) scale(0.8);
    }
  }

  @media (max-width: 900px) {
    .brick-animation {
      opacity: 0.35;
      right: -5%;
      transform: translateY(-50%) scale(0.65);
    }
  }

  @media (max-width: 768px) {
    .brick-animation {
      display: none;
    }
  }

  .hero-tagline {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  .hero-tagline span {
    color: var(--primary);
    font-weight: 500;
  }

  .hero-title {
    font-size: clamp(3rem, 8vw, 4.5rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--text-primary);
    margin-bottom: 2rem;
    letter-spacing: -0.03em;
  }

  .hero-subtitle {
    max-width: 42ch;
    margin-bottom: 2rem;
    color: var(--text-secondary);
    font-size: 1.125rem;
    line-height: 1.6;
  }

  .hero-tutorial-link {
    display: inline-block;
    margin-top: 1rem;
    color: var(--primary-dark);
    font-size: 0.875rem;
    font-weight: 600;
    text-underline-offset: 3px;
  }

  .hero-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.5rem;
  }

  .btn-hero {
    display: none;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .hero {
      min-height: auto;
    }

    .hero-card {
      align-items: center;
      justify-content: center;
      padding: 7rem 1.5rem 4rem;
      min-height: auto;
      border-radius: 0;
    }

    .hero-container {
      max-width: 100%;
      text-align: center;
    }

    .hero-title {
      font-size: 2.5rem;
    }

    .hero-actions {
      align-items: center;
    }
  }

  @media (max-width: 480px) {
    .hero-card {
      padding: 6rem 1.25rem 3rem;
      border-radius: 0;
    }

    .hero-title {
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    .hero-tagline {
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  }

  /* Commercial-inspired art direction */
  .hero {
    padding: 0;
    background: transparent;
  }

  .hero-card {
    min-height: 100dvh;
    align-items: flex-start;
    padding: 7.5rem 4rem 5rem;
    border: none;
    border-radius: 0;
    background:
      linear-gradient(rgba(31, 28, 27, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31, 28, 27, 0.035) 1px, transparent 1px),
      radial-gradient(circle at 72% 44%, rgba(255, 105, 71, 0.16), transparent 30%),
      var(--bg-card);
    background-size: 92px 92px, 92px 92px, 100% 100%, 100% 100%;
    box-shadow: var(--shadow-soft);
  }

  .hero-card::before,
  .hero-card::after {
    content: "";
    position: absolute;
    width: 52px;
    height: 22px;
    border: 1px solid rgba(255, 105, 71, 0.32);
    border-radius: 0;
    pointer-events: none;
  }

  .hero-card::before {
    top: 20%;
    left: 46%;
    transform: rotate(14deg);
    animation: floatBrick 8s ease-in-out infinite;
  }

  .hero-card::after {
    right: 8%;
    bottom: 13%;
    transform: rotate(-16deg);
    animation: floatBrick 10s ease-in-out -3s infinite reverse;
  }

  .hero-inner {
    max-width: 1240px;
  }

  .hero-container {
    max-width: 760px;
  }

  .hero-tagline {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    margin-bottom: 2rem;
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .hero-tagline::before {
    content: "";
    width: 42px;
    height: 2px;
    background: var(--primary);
  }

  .hero-tagline span {
    color: var(--primary);
    font-weight: 700;
  }

  .hero-title {
    max-width: 11ch;
    margin-bottom: 1.5rem;
    font-size: clamp(4.5rem, 9vw, 8.5rem);
    font-weight: 800;
    line-height: 0.86;
    letter-spacing: -0.075em;
  }

  .hero-title .title-accent {
    display: block;
    color: var(--primary);
  }

  .hero-subtitle {
    max-width: 38ch;
    font-size: clamp(1.1rem, 2vw, 1.35rem);
  }

  .brick-animation {
    right: -3%;
    width: min(44vw, 570px);
    height: min(44vw, 570px);
    filter: drop-shadow(0 36px 45px rgba(255, 105, 71, 0.2));
    transition: transform 0.8s var(--ease-out);
  }

  .hero-card:hover .brick-animation {
    transform: translateY(-52%) rotate(2deg) scale(1.02);
  }

  @keyframes floatBrick {
    0%,
    100% {
      translate: 0 0;
    }
    50% {
      translate: 0 -18px;
    }
  }

  @media (max-width: 900px) {
    .hero-card {
      padding-inline: 2.5rem;
    }

    .hero-title {
      font-size: clamp(4rem, 14vw, 7rem);
    }
  }

  @media (max-width: 768px) {
    .hero {
      padding: 0;
    }

    .hero-card {
      min-height: 100dvh;
      padding: 6rem 1.4rem 4rem;
      border-radius: 0;
    }

    .hero-container {
      text-align: left;
    }

    .hero-title {
      font-size: clamp(4rem, 21vw, 6rem);
    }

    .hero-actions {
      align-items: flex-start;
    }

    .hero-tagline {
      justify-content: flex-start;
    }
  }

  @media (max-width: 480px) {
    .hero-card {
      padding-top: 5.5rem;
    }

    .hero-title {
      font-size: clamp(3.5rem, 19vw, 5rem);
    }

    .hero-tagline {
      font-size: 0.64rem;
      letter-spacing: 0.12em;
    }
  }

  /* Easter egg: smashable bricks (see the script below and /brick-smash/) */
  install-section {
    display: block;
  }

  .brick-animation svg:focus {
    outline: none;
  }

  .brick-animation svg:focus-visible {
    filter: drop-shadow(0 0 1.5px var(--primary)) drop-shadow(0 0 14px rgba(255, 105, 71, 0.55));
  }

  .brick-toast {
    position: absolute;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.6rem 0.9rem;
    color: var(--primary-dark);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    background: rgba(251, 248, 244, 0.86);
    border: 1px solid rgba(255, 105, 71, 0.28);
    box-shadow: 0 14px 34px rgba(58, 36, 28, 0.12);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 10px) scale(0.96);
    transition:
      opacity 0.35s var(--ease-out),
      transform 0.5s var(--ease-out);
  }

  .brick-toast.is-visible {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  .brick-toast-rule {
    width: 18px;
    height: 2px;
    background: var(--primary);
  }

  .brick-toast-count {
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<section class="hero">
  <div class="hero-card" $ref="heroCard">
    <div class="hero-inner" $ref="heroInner">
      <div class="hero-container" $ref="heroCopy">
        <p class="hero-tagline">
          Web development, rebuilt
        </p>
        <h1 class="hero-title" $ref="heroTitle">
          Build the web.
          <span class="title-accent">Brick by brick.</span>
        </h1>
        <p class="hero-subtitle">Reactive web components with plain HTML, CSS, and JavaScript. Zero dependencies. No build maze.</p>

        <install-section></install-section>
      </div>

      <!-- Brick stacking animation - SVG Isometric (matches logo: 2 bottom + 1 top).
           Also an easter egg: click it (or focus it and press Enter). It comes after the
           copy so its keyboard stop follows the hero's main content. -->
      <div class="brick-animation" $ref="brickStage">
        <svg viewBox="-20 40 488 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="heroBrickTop" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffd4bd" />
              <stop offset="100%" stop-color="#fde4d0" />
            </linearGradient>
            <linearGradient id="heroBrickLeft" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fbc9a8" />
              <stop offset="100%" stop-color="#f5ad85" />
            </linearGradient>
            <linearGradient id="heroBrickRight" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f5ad85" />
              <stop offset="100%" stop-color="#ff6b35" />
            </linearGradient>
            <filter id="brickShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="10" />
            </filter>
          </defs>

          <!-- Soft ground shadow -->
          <ellipse class="shadow-el" cx="224" cy="420" rx="190" ry="18" fill="rgba(234, 88, 12, 0.14)"
            filter="url(#brickShadow)" />

          <!-- Bottom-left brick -->
          <g class="cube-group">
            <polygon points="112,210 224,266 112,322 0,266" fill="url(#heroBrickTop)" />
            <polygon points="0,266 0,336 112,392 112,322" fill="url(#heroBrickLeft)" />
            <polygon points="112,322 224,266 224,336 112,392" fill="url(#heroBrickRight)" />
          </g>

          <!-- Bottom-right brick -->
          <g class="cube-group">
            <polygon points="336,210 448,266 336,322 224,266" fill="url(#heroBrickTop)" />
            <polygon points="224,266 224,336 336,392 336,322" fill="url(#heroBrickLeft)" />
            <polygon points="336,322 448,266 448,336 336,392" fill="url(#heroBrickRight)" />
          </g>

          <!-- Top brick -->
          <g class="cube-group">
            <polygon points="224,56 336,112 224,168 112,112" fill="url(#heroBrickTop)" />
            <polygon points="112,112 112,182 224,238 224,168" fill="url(#heroBrickLeft)" />
            <polygon points="224,168 336,112 336,182 224,238" fill="url(#heroBrickRight)" />
          </g>
        </svg>
      </div>

      <div class="brick-toast" $ref="brickToast" aria-hidden="true"></div>
      <p class="sr-only" role="status" $ref="brickStatus"></p>
    </div>
  </div>
</section>

<script>
  // Easter egg. Hovering and pressing the bricks gives springy feedback; a click emits
  // "bricks:smash", which index.html answers by lazy-loading the effect from /brick-smash/.
  // It all lives in this closure so none of it becomes reactive component state.
  (() => {
    const stage = $refs.brickStage;
    const svg = stage.querySelector("svg");
    const bricks = [...svg.querySelectorAll(".cube-group")];
    const card = $refs.heroCard;
    const wide = matchMedia("(min-width: 901px)");
    const calm = matchMedia("(prefers-reduced-motion: reduce)");
    // Brick outlines in SVG user units: bottom-left, bottom-right, top. Hit-testing them
    // geometrically works even where the copy's box overlaps the stack.
    const OUTLINES = [
      [112, 210, 224, 266, 224, 336, 112, 392, 0, 336, 0, 266],
      [336, 210, 448, 266, 448, 336, 336, 392, 224, 336, 224, 266],
      [224, 56, 336, 112, 336, 182, 224, 238, 112, 182, 112, 112],
    ];
    const rest = () => ({ x: 0, y: 0, vx: 0, vy: 0, sx: 1, sy: 1, vsx: 0, vsy: 0 });
    const springs = bricks.map(rest);
    let hovered = -1;
    let pressed = -1;
    let pressing = false;
    let busy = false;
    let warmed = false;
    let pointer = null;
    let down = null;
    let hoverSince = 0;
    let lastHop = 0;
    let frame = 0;
    let last = 0;

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    const toUser = (x, y) => {
      const m = svg.getScreenCTM();
      return m ? new DOMPoint(x, y).matrixTransform(m.inverse()) : null;
    };

    const inside = (poly, x, y) => {
      for (let i = 0; i < poly.length; i += 2) {
        const x1 = poly[i];
        const y1 = poly[i + 1];
        const x2 = poly[(i + 2) % poly.length];
        const y2 = poly[(i + 3) % poly.length];
        if ((x2 - x1) * (y - y1) - (y2 - y1) * (x - x1) < 0) return false;
      }
      return true;
    };

    const hitAt = (p) => {
      if (!p) return -1;
      for (const i of [2, 0, 1]) {
        if (inside(OUTLINES[i], p.x - springs[i].x, p.y - springs[i].y)) return i;
      }
      return -1;
    };

    const warm = () => {
      if (warmed) return;
      warmed = true;
      $emit("bricks:warmup");
    };

    const setHover = (i) => {
      if (i === hovered) return;
      hovered = i;
      hoverSince = performance.now();
      card.style.cursor = i >= 0 ? "pointer" : "";
      if (i >= 0) warm();
    };

    // Springs: hovered brick lifts, the stack leans toward the pointer (the floating top
    // brick more, for depth), pressing squashes, and lingering earns a little "click me" hop.
    const tick = (now) => {
      frame = 0;
      const dt = Math.min(0.032, last ? (now - last) / 1000 : 1 / 60);
      last = now;
      let moving = false;
      springs.forEach((s, i) => {
        let tx = 0;
        let ty = 0;
        let tsx = 1;
        let tsy = 1;
        if (pointer) {
          const f = i === 2 ? 0.035 : 0.018;
          tx = clamp((pointer.x - 224) * f, -9, 9);
          ty = clamp((pointer.y - 250) * f, -9, 9);
        }
        if (i === hovered) {
          const squish = pressing && pressed === i;
          ty -= squish ? 3 : 10;
          if (squish) {
            tsx = 1.035;
            tsy = 0.93;
          } else if (now - hoverSince > 1100 && now - lastHop > 2400) {
            s.vy -= 170;
            lastHop = now;
          }
        }
        s.vx += (-(s.x - tx) * 300 - s.vx * 18) * dt;
        s.vy += (-(s.y - ty) * 300 - s.vy * 18) * dt;
        s.vsx += (-(s.sx - tsx) * 520 - s.vsx * 24) * dt;
        s.vsy += (-(s.sy - tsy) * 520 - s.vsy * 24) * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.sx += s.vsx * dt;
        s.sy += s.vsy * dt;
        const settled =
          Math.abs(s.x - tx) + Math.abs(s.y - ty) < 0.05 &&
          Math.abs(s.vx) + Math.abs(s.vy) < 0.5 &&
          Math.abs(s.sx - tsx) + Math.abs(s.sy - tsy) < 0.001 &&
          Math.abs(s.vsx) + Math.abs(s.vsy) < 0.01;
        if (!settled) moving = true;
        const g = bricks[i];
        if (settled && !pointer && i !== hovered) {
          Object.assign(s, rest());
          g.style.translate = "";
          g.style.scale = "";
        } else {
          g.style.translate = `${s.x.toFixed(2)}px ${s.y.toFixed(2)}px`;
          g.style.scale = `${s.sx.toFixed(4)} ${s.sy.toFixed(4)}`;
        }
      });
      if (!busy && (moving || hovered >= 0)) frame = requestAnimationFrame(tick);
      else last = 0;
    };

    const kick = () => {
      if (!frame && !busy && !calm.matches) frame = requestAnimationFrame(tick);
    };

    const smash = (i, x, y) => {
      if (busy || bricks.some((g) => g.getAnimations().some((a) => a.playState === "running"))) return;
      const detail = {
        brick: i,
        x,
        y,
        reducedMotion: calm.matches,
        offsets: springs.map((s) => ({ x: s.x, y: s.y, sx: s.sx, sy: s.sy })),
        el: {
          stage,
          svg,
          bricks,
          card,
          ground: svg.querySelector(".shadow-el"),
          inner: $refs.heroInner,
          copy: $refs.heroCopy,
          title: $refs.heroTitle,
          toast: $refs.brickToast,
          status: $refs.brickStatus,
        },
        done: () => {
          busy = false;
        },
      };
      $emit("bricks:smash", detail);
      if (!detail.accepted) return;
      busy = true;
      cancelAnimationFrame(frame);
      frame = 0;
      last = 0;
      pressing = false;
      pressed = -1;
      pointer = null;
      setHover(-1);
      springs.forEach((s) => Object.assign(s, rest()));
    };

    card.addEventListener("pointermove", (e) => {
      if (busy || !wide.matches) return;
      pointer = toUser(e.clientX, e.clientY);
      setHover(hitAt(pointer));
      kick();
    });

    card.addEventListener("pointerleave", () => {
      pointer = null;
      pressing = false;
      setHover(-1);
      kick();
    });

    card.addEventListener("pointerdown", (e) => {
      if (busy || !wide.matches || e.button !== 0) return;
      const p = toUser(e.clientX, e.clientY);
      const i = hitAt(p);
      if (i < 0) return;
      pointer = p;
      setHover(i);
      pressed = i;
      pressing = true;
      down = { x: e.clientX, y: e.clientY };
      addEventListener(
        "pointerup",
        () => {
          pressing = false;
          kick();
        },
        { once: true },
      );
      kick();
    });

    card.addEventListener("click", (e) => {
      const i = pressed;
      pressed = -1;
      if (i < 0 || busy || !down) return;
      if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) return;
      if (hitAt(toUser(e.clientX, e.clientY)) !== i) return;
      const interactive = "a, button, input, textarea, select, install-section";
      if (e.composedPath().some((n) => n instanceof Element && n.matches(interactive))) return;
      smash(i, e.clientX, e.clientY);
    });

    svg.addEventListener("focus", warm);
    // Real pointers never target the SVG (the stage is pointer-events: none), so a click
    // here is a screen reader, Voice Control or Switch Control pressing the button.
    svg.addEventListener("click", () => {
      if (wide.matches) smash(2, null, null);
    });
    svg.addEventListener("keydown", (e) => {
      if ((e.key !== "Enter" && e.key !== " ") || e.repeat) return;
      e.preventDefault();
      smash(2, null, null);
    });

    // Only a button where the stack is actually shown at full strength.
    const syncRole = () => {
      if (wide.matches) {
        svg.setAttribute("role", "button");
        svg.setAttribute("tabindex", "0");
        svg.setAttribute("aria-label", "Smash the bricks");
        svg.removeAttribute("aria-hidden");
      } else {
        svg.removeAttribute("role");
        svg.removeAttribute("tabindex");
        svg.removeAttribute("aria-label");
        svg.setAttribute("aria-hidden", "true");
      }
    };
    wide.addEventListener("change", syncRole);
    syncRole();
  })();
</script>
